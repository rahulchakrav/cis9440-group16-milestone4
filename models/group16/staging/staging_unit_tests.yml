version: 2

unit_tests:
  - name: collisions_clean_fields_and_apply_severity
    model: stg_nyc_collisions
    overrides:
      vars:
        group16_collision_timestamp_timezone: UTC
    given:
      - input: source('group16_raw', 'source_nyc_mv_collisions')
        rows:
          - {collision_id: 1, crash_date: '2021-01-01 00:00:00+00', crash_time: '06:05', borough: ' the bronx ', zip_code: '10451-1234', number_of_persons_injured: 1, number_of_persons_killed: 0, number_of_cyclist_injured: '1'}
          - {collision_id: 2, crash_date: '2026-06-30 00:00:00+00', crash_time: null, borough: 'UNSPECIFIED', zip_code: null, number_of_persons_injured: null, number_of_persons_killed: 1}
          - {collision_id: 3, crash_date: '2023-02-10 00:00:00+00', crash_time: '23:59:00', borough: 'Queens', zip_code: '11354', number_of_persons_injured: null, number_of_persons_killed: 0}
          - {collision_id: 4, crash_date: '2023-02-10 00:00:00+00', crash_time: 'bad time', number_of_persons_injured: 2, number_of_persons_killed: 0, number_of_cyclist_injured: 'bad count'}
          - {collision_id: 5, crash_date: '2023-02-10 00:00:00+00', number_of_persons_injured: 0, number_of_persons_killed: 0}
          - {collision_id: 6, crash_date: '2023-02-10 00:00:00+00', number_of_persons_injured: -1, number_of_persons_killed: 0}
          - {collision_id: 7, crash_date: '2020-12-31 00:00:00+00'}
          - {collision_id: 8, crash_date: '2026-07-01 00:00:00+00'}
          - {collision_id: 9, crash_date: null}
    expect:
      rows:
        - {collision_id: 1, crash_date_key: 20210101, crash_time_key: 605, borough: BRONX, zip_code: '10451', severity_key: 2, number_of_persons_injured: 1, number_of_cyclist_injured: 1, has_invalid_crash_time: false, has_invalid_injury_count: false}
        - {collision_id: 2, crash_date_key: 20260630, crash_time_key: -1, borough: Unknown, zip_code: Unknown, severity_key: 4, number_of_persons_injured: null, number_of_cyclist_injured: 0, has_invalid_crash_time: false, has_invalid_injury_count: false}
        - {collision_id: 3, crash_date_key: 20230210, crash_time_key: 2359, borough: QUEENS, zip_code: '11354', severity_key: 0, number_of_persons_injured: null, number_of_cyclist_injured: 0, has_invalid_crash_time: false, has_invalid_injury_count: false}
        - {collision_id: 4, crash_date_key: 20230210, crash_time_key: -1, borough: Unknown, zip_code: Unknown, severity_key: 3, number_of_persons_injured: 2, number_of_cyclist_injured: null, has_invalid_crash_time: true, has_invalid_injury_count: true}
        - {collision_id: 5, crash_date_key: 20230210, crash_time_key: -1, borough: Unknown, zip_code: Unknown, severity_key: 1, number_of_persons_injured: 0, number_of_cyclist_injured: 0, has_invalid_crash_time: false, has_invalid_injury_count: false}
        - {collision_id: 6, crash_date_key: 20230210, crash_time_key: -1, borough: Unknown, zip_code: Unknown, severity_key: 0, number_of_persons_injured: -1, number_of_cyclist_injured: 0, has_invalid_crash_time: false, has_invalid_injury_count: true}

  - name: collisions_preserve_duplicates_for_data_tests
    model: stg_nyc_collisions
    overrides:
      vars:
        group16_collision_timestamp_timezone: UTC
    given:
      - input: source('group16_raw', 'source_nyc_mv_collisions')
        rows:
          - {collision_id: 10, crash_date: '2024-01-01 00:00:00+00', number_of_persons_injured: 0, number_of_persons_killed: 0}
          - {collision_id: 10, crash_date: '2024-01-01 00:00:00+00', number_of_persons_injured: 1, number_of_persons_killed: 0}
    expect:
      rows:
        - {collision_id: 10, severity_key: 1, collision_count: 1}
        - {collision_id: 10, severity_key: 2, collision_count: 1}

  - name: requests_keep_open_and_late_closing_requests
    model: stg_nyc_311_requests
    overrides:
      vars:
        group16_311_timestamp_timezone: UTC
    given:
      - input: source('group16_raw', 'source_nyc_311_streetlight_signal')
        rows:
          - {unique_key: '100', created_date: '2021-01-01 00:00:00+00', closed_date: null, complaint_type: ' street light condition ', borough: 'Brooklyn', incident_zip: '11201', descriptor: '', status: 'OPEN'}
          - {unique_key: '101', created_date: '2026-06-30 23:30:00+00', closed_date: '2026-07-01 00:30:00+00', complaint_type: 'TRAFFIC SIGNAL CONDITION', borough: 'Manhattan', incident_zip: '10001-1234', descriptor: 'Signal out', status: 'closed'}
          - {unique_key: '102', created_date: '2026-07-01 00:00:00+00', complaint_type: 'Street Light Condition'}
          - {unique_key: '103', created_date: '2020-12-31 23:59:59+00', complaint_type: 'Street Light Condition'}
          - {unique_key: '104', created_date: '2024-02-01 00:00:00+00', complaint_type: 'Noise'}
          - {unique_key: '105', created_date: null, complaint_type: 'Street Light Condition'}
          - {unique_key: 'bad-id', created_date: '2024-02-01 00:00:00+00', complaint_type: 'Street Light Condition', status: null}
    expect:
      rows:
        - {unique_key: 100, raw_unique_key: '100', created_date_key: 20210101, created_time_key: 0, closed_date_key: 0, descriptor: 'Not specified', status: Open, is_closed: false, resolution_hours: null}
        - {unique_key: 101, raw_unique_key: '101', created_date_key: 20260630, created_time_key: 2330, closed_date_key: 20260701, descriptor: 'Signal out', status: Closed, is_closed: true, resolution_hours: 1}
        - {unique_key: null, raw_unique_key: 'bad-id', created_date_key: 20240201, created_time_key: 0, closed_date_key: 0, descriptor: 'Not specified', status: Unknown, is_closed: false, resolution_hours: null}

  - name: requests_decode_real_instants_at_nyc_boundaries
    model: stg_nyc_311_requests
    overrides:
      vars:
        group16_311_timestamp_timezone: America/New_York
    given:
      - input: source('group16_raw', 'source_nyc_311_streetlight_signal')
        rows:
          - {unique_key: '200', created_date: '2021-01-01 04:59:59+00', complaint_type: 'Street Light Condition'}
          - {unique_key: '201', created_date: '2021-01-01 05:00:00+00', complaint_type: 'Street Light Condition'}
          - {unique_key: '202', created_date: '2026-07-01 03:59:59+00', complaint_type: 'Street Light Condition'}
          - {unique_key: '203', created_date: '2026-07-01 04:00:00+00', complaint_type: 'Street Light Condition'}
    expect:
      rows:
        - {unique_key: 201, created_date_key: 20210101, created_time_key: 0}
        - {unique_key: 202, created_date_key: 20260630, created_time_key: 2359}
