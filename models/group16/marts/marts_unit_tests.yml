version: 2
unit_tests:
- name: location_combines_both_sources_and_retains_partial_unknowns
  model: dim_location
  given:
  - input: ref('stg_nyc_collisions')
    rows:
    - borough: BROOKLYN
      zip_code: '11201'
    - borough: BROOKLYN
      zip_code: '11201'
    - borough: BRONX
      zip_code: Unknown
  - input: ref('stg_nyc_311_requests')
    rows:
    - borough: BROOKLYN
      zip_code: '11201'
    - borough: QUEENS
      zip_code: '11354'
    - borough: Unknown
      zip_code: '10001'
  expect:
    rows:
    - borough: BROOKLYN
      zip_code: '11201'
    - borough: BRONX
      zip_code: Unknown
    - borough: QUEENS
      zip_code: '11354'
    - borough: Unknown
      zip_code: '10001'
    - borough: Unknown
      zip_code: Unknown
- name: complaint_distinguishes_null_detail_from_text
  model: dim_complaint
  given:
  - input: ref('stg_nyc_311_requests')
    rows:
    - &id001
      complaint_type: Street Light Condition
      descriptor: Not specified
      descriptor_2: null
    - complaint_type: Street Light Condition
      descriptor: Not specified
      descriptor_2: null
    - &id002
      complaint_type: Street Light Condition
      descriptor: Not specified
      descriptor_2: 'null'
    - &id003
      complaint_type: Traffic Signal Condition
      descriptor: Signal out
      descriptor_2: null
  expect:
    rows:
    - *id001
    - *id002
    - *id003
- name: status_deduplicates_and_keeps_unknown
  model: dim_request_status
  given:
  - input: ref('stg_nyc_311_requests')
    rows:
    - status: Closed
    - status: Open
    - status: Closed
  expect:
    rows:
    - status: Closed
      is_closed: true
    - status: Open
      is_closed: false
    - status: Unknown
      is_closed: false
- name: collision_fact_preserves_measures_and_missing_matches
  model: fact_collision
  given:
  - input: ref('stg_nyc_collisions')
    rows:
    - collision_id: 1
      crash_date_key: 20210101
      crash_time_key: -1
      borough: Unknown
      zip_code: Unknown
      severity_key: 4
      collision_count: 1
      number_of_persons_injured: null
      number_of_persons_killed: 1
      loaded_at_utc: '2026-10-21 12:00:00+00'
    - collision_id: 2
      crash_date_key: 20210101
      crash_time_key: 930
      borough: BRONX
      zip_code: Unknown
      severity_key: 1
      collision_count: 1
      number_of_persons_injured: 0
      number_of_persons_killed: 0
      loaded_at_utc: null
    - collision_id: 3
      crash_date_key: 20210101
      crash_time_key: 930
      borough: QUEENS
      zip_code: '11354'
      severity_key: 0
      collision_count: 1
      number_of_persons_injured: null
      number_of_persons_killed: null
      loaded_at_utc: null
  - input: ref('dim_date')
    rows:
    - date_key: 20210101
  - input: ref('dim_time')
    rows:
    - time_key: -1
    - time_key: 930
  - input: ref('dim_location')
    rows:
    - location_key: 0
      borough: Unknown
      zip_code: Unknown
    - location_key: 12
      borough: BRONX
      zip_code: Unknown
  - input: ref('dim_crash_severity')
    rows:
    - severity_key: 0
    - severity_key: 1
    - severity_key: 4
  expect:
    rows:
    - collision_id: 1
      crash_date_key: 20210101
      crash_time_key: -1
      location_key: 0
      severity_key: 4
      collision_count: 1
      number_of_persons_injured: null
      number_of_persons_killed: 1
      loaded_at_utc: '2026-10-21 12:00:00+00'
    - collision_id: 2
      crash_date_key: 20210101
      crash_time_key: 930
      location_key: 12
      severity_key: 1
      collision_count: 1
      number_of_persons_injured: 0
      number_of_persons_killed: 0
      loaded_at_utc: null
    - collision_id: 3
      crash_date_key: 20210101
      crash_time_key: 930
      location_key: null
      severity_key: 0
      collision_count: 1
      number_of_persons_injured: null
      number_of_persons_killed: null
      loaded_at_utc: null
